<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer class="sidenav" fixedInViewport [class.hidden-sidebar]="!showSidebar()"
        [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
        [mode]="showSidebar() ? ((isHandset$ | async) ? 'over' : 'side') : 'over'"
        [opened]="showSidebar() && (isHandset$ | async) === false">

        <div class="logo-container">
            <button mat-icon-button (click)="drawer.toggle()" *ngIf="!(isHandset$ | async)">
                <mat-icon>menu</mat-icon>
            </button>
            <div class="logo-image-wrapper">
                <img src="/logo.png" alt="Caribou Coffee" class="nav-logo">
            </div>
        </div>

        <div class="nav-content">
            <!-- ADMIN sidebar -->
            <mat-nav-list *ngIf="sidebarMode() === 'ADMIN'">
                <div class="nav-group-title">Entreprises</div>

                <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">space_dashboard</mat-icon>
                    <div matListItemTitle>Dashboard</div>
                </a>

                <a mat-list-item routerLink="/coffees" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">store</mat-icon>
                    <div matListItemTitle>Cafés</div>
                </a>

                <a mat-list-item routerLink="/audits" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">list</mat-icon>
                    <div matListItemTitle>Audits</div>
                </a>

                <a mat-list-item routerLink="/users" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">people</mat-icon>
                    <div matListItemTitle>Utilisateurs</div>
                </a>

                <a mat-list-item routerLink="/settings" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">settings</mat-icon>
                    <div matListItemTitle>Grille d'Audit</div>
                </a>
            </mat-nav-list>

            <!-- VIEWER sidebar -->
            <mat-nav-list *ngIf="sidebarMode() === 'VIEWER'">
                <div class="nav-group-title">{{ currentUser()?.coffee?.name || 'Mon Café' }}</div>

                <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">space_dashboard</mat-icon>
                    <div matListItemTitle>Tableau de Bord</div>
                </a>

                <a mat-list-item routerLink="/audits" routerLinkActive="active-link">
                    <mat-icon matListItemIcon class="nav-icon">list</mat-icon>
                    <div matListItemTitle>Audits</div>
                </a>
            </mat-nav-list>

            <div class="sidebar-footer-illustration">
                <img src="assets/lighthouse-illustration.svg" alt="" class="illustration-img"
                    onerror="this.style.display='none'">
                <div class="illustration-fallback"></div>
            </div>
        </div>
    </mat-sidenav>

    <!-- Main Content -->
    <mat-sidenav-content>
        <mat-toolbar class="main-toolbar">
            <!-- Hamburger for sidebar roles -->
            <button *ngIf="showSidebar()" type="button" aria-label="Toggle sidenav" mat-icon-button
                (click)="drawer.toggle()">
                <mat-icon>menu</mat-icon>
            </button>

            <!-- Logo for non-sidebar users -->
            <img *ngIf="!showSidebar()" src="/logo.png" alt="Caribou Coffee" class="toolbar-logo">

            <span class="toolbar-title">{{ pageTitle }}</span>

            <!-- Global back button placed in the yellow place -->
            <button type="button" aria-label="Go back" mat-icon-button (click)="goBack()" class="global-back-btn">
                <mat-icon>arrow_back</mat-icon>
            </button>

            <span class="spacer"></span>

            <span class="role-badge" *ngIf="roleDisplay()">{{ roleDisplay() }}</span>

            <button mat-icon-button (click)="toggleDarkMode()"
                [matTooltip]="themeService.isDarkMode() ? 'Mode Clair' : 'Mode Sombre'">
                <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>

            <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-btn">
                <span class="user-name">{{ currentUser()?.full_name }}</span>
                <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
            </button>
            <mat-menu #userMenu="matMenu" class="user-menu">
                <div class="user-menu-header d-flex">
                    <div class="user-info col">
                        <div class="user-name-large">{{ currentUser()?.full_name }}</div>
                        <div class="user-email">{{ currentUser()?.email }}</div>
                    </div>
                </div>
                <mat-divider></mat-divider>
                <button mat-menu-item routerLink="/dashboard">
                    <mat-icon>space_dashboard</mat-icon>
                    <span>Mon Tableau de Bord</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="openChangePasswordDialog()">
                    <mat-icon>lock</mat-icon>
                    <span>Changer le mot de passe</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="logout()" class="logout-btn">
                    <mat-icon>logout</mat-icon>
                    <span>Déconnexion</span>
                </button>
            </mat-menu>
        </mat-toolbar>

        <div class="main-body">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
