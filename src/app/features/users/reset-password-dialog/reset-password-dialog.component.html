<h2 mat-dialog-title>Réinitialiser le mot de passe</h2>

<mat-dialog-content>
    <p class="dialog-hint">Nouveau mot de passe pour <strong>{{ user.full_name }}</strong> ({{ user.email }})</p>
    <form [formGroup]="form" class="password-form">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nouveau mot de passe</mat-label>
            <input matInput formControlName="new_password" [type]="hideNew ? 'password' : 'text'">
            <button mat-icon-button matSuffix type="button" (click)="hideNew = !hideNew" tabindex="-1">
                <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="form.get('new_password')?.hasError('required')">Requis</mat-error>
            <mat-error *ngIf="form.get('new_password')?.hasError('minlength')">Minimum 6 caractères</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirmer le mot de passe</mat-label>
            <input matInput formControlName="confirm_password" [type]="hideConfirm ? 'password' : 'text'">
            <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm" tabindex="-1">
                <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="form.hasError('mismatch') && form.get('confirm_password')?.touched">
                Les mots de passe ne correspondent pas
            </mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Annuler</button>
    <button mat-flat-button color="primary" (click)="submit()"
        [disabled]="form.invalid || submitting">
        {{ submitting ? 'En cours...' : 'Réinitialiser' }}
    </button>
</mat-dialog-actions>
