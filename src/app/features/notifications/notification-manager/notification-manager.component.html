<div class="page-container">
    <div class="page-header">
        <mat-icon class="breadcrumb-icon">notifications</mat-icon>
        <span class="breadcrumb-text">Admin > Notifications Email</span>
    </div>

    <div class="content-card modern-card">
        <div class="table-toolbar">
            <div class="search-field-wrapper">
                <mat-icon class="search-icon">search</mat-icon>
                <input type="text" placeholder="Rechercher des utilisateurs..." (keyup)="applyFilter($event)" #input>
            </div>

            <div class="actions-wrapper">
                <button mat-flat-button color="primary" (click)="sendEmailNow()" [disabled]="isSending()"
                    style="margin-right: 12px; border-radius: 8px;">
                    <mat-icon *ngIf="!isSending()">send</mat-icon>
                    <mat-icon *ngIf="isSending()">hourglass_empty</mat-icon>
                    {{ isSending() ? 'Envoi en cours...' : 'Envoyer rapports maintenant' }}
                </button>
                <button mat-icon-button class="icon-btn-secondary" matTooltip="Filtrer">
                    <mat-icon>filter_list</mat-icon>
                </button>
                <button mat-icon-button class="icon-btn-secondary" matTooltip="Options">
                    <mat-icon>more_vert</mat-icon>
                </button>
            </div>
        </div>

        <table mat-table [dataSource]="dataSource" matSort class="custom-table">

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom </th>
                <td mat-cell *matCellDef="let element"> {{element.full_name}} </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let element"> {{element.email}} </td>
            </ng-container>

            <!-- Daily Column -->
            <ng-container matColumnDef="daily">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Quotidien </th>
                <td mat-cell *matCellDef="let element">
                    <mat-checkbox [checked]="element.receive_daily_report"
                        (change)="togglePreference(element, 'receive_daily_report', $event.checked)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Weekly Column -->
            <ng-container matColumnDef="weekly">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Hebdomadaire </th>
                <td mat-cell *matCellDef="let element">
                    <mat-checkbox [checked]="element.receive_weekly_report"
                        (change)="togglePreference(element, 'receive_weekly_report', $event.checked)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Monthly Column -->
            <ng-container matColumnDef="monthly">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Mensuel </th>
                <td mat-cell *matCellDef="let element">
                    <mat-checkbox [checked]="element.receive_monthly_report"
                        (change)="togglePreference(element, 'receive_monthly_report', $event.checked)">
                    </mat-checkbox>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[25, 50, 100, 1000]" showFirstLastButtons
            aria-label="Select page"></mat-paginator>
    </div>
</div>
