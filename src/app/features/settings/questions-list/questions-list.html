<div class="questions-container">
    <div class="page-header">
        <div class="header-left">
            <button mat-icon-button (click)="goBack()">
                <mat-icon>arrow_back</mat-icon>
            </button>
            <div>
                <h1>Questions - {{ category()?.name }}</h1>
                <p class="category-description">{{ category()?.description }}</p>
            </div>
        </div>
        <button mat-raised-button color="primary" (click)="openAddDialog()">
            <mat-icon>add</mat-icon>
            Nouvelle Question
        </button>
    </div>

    <mat-card class="table-card">
        <div class="table-container">
            <table mat-table [dataSource]="questions()" class="questions-table">
                <!-- Text Column -->
                <ng-container matColumnDef="text">
                    <th mat-header-cell *matHeaderCellDef>Question</th>
                    <td mat-cell *matCellDef="let question">{{ question.text }}</td>
                </ng-container>

                <!-- Weight Column -->
                <ng-container matColumnDef="weight">
                    <th mat-header-cell *matHeaderCellDef>Poids</th>
                    <td mat-cell *matCellDef="let question">
                        <mat-chip [color]="getWeightColor(question.weight)" highlighted>
                            {{ question.weight }}
                        </mat-chip>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
                    <td mat-cell *matCellDef="let question" class="actions-cell">
                        <button mat-icon-button [matMenuTriggerFor]="menu">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="openEditDialog(question)">
                                <mat-icon>edit</mat-icon>
                                <span>Modifier</span>
                            </button>
                            <button mat-menu-item (click)="deleteQuestion(question)" class="delete-action">
                                <mat-icon color="warn">delete</mat-icon>
                                <span>Supprimer</span>
                            </button>
                        </mat-menu>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- No data row -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" [attr.colspan]="displayedColumns.length"
                        style="text-align: center; padding: 24px;">
                        @if (isLoading()) {
                        <p>Chargement...</p>
                        } @else {
                        <p>Aucune question trouvée</p>
                        }
                    </td>
                </tr>
            </table>
        </div>
    </mat-card>
</div>
