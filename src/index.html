<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Caribou Audit Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Caribou Audit">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body class="mat-typography">
  <script>
    // Capture the PWA install prompt as early as possible (before Angular bootstraps).
    // Otherwise the event fires before our PwaInstallService is instantiated and we miss it.
    window.__pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-available'));
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaDeferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });
  </script>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
